<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tech Saathi - Your Digital Companion</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --orange:  #FF5F1F;
            --yellow:  #FFD600;
            --cyan:    #00E5FF;
            --pink:    #FF2D78;
            --lime:    #AAFF00;
            --deep:    #080810;
            --card:    #0F0F1A;
            --border:  rgba(255,255,255,0.08);
            --text:    #FFFFFF;
            --muted:   #555577;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--deep);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── AURORA BACKGROUND ── */
        .aurora {
            position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
        }
        .aurora-blob {
            position: absolute; border-radius: 50%; filter: blur(120px);
            animation: auroraDrift 18s ease-in-out infinite;
        }
        .ab1 { width: 700px; height: 700px; background: var(--orange); opacity: 0.22; top: -300px; right: -200px; animation-delay: 0s; }
        .ab2 { width: 500px; height: 500px; background: var(--pink);   opacity: 0.18; bottom: -150px; left: -150px; animation-delay: -6s; }
        .ab3 { width: 400px; height: 400px; background: var(--cyan);   opacity: 0.14; top: 40%; left: 30%; animation-delay: -11s; }
        .ab4 { width: 300px; height: 300px; background: var(--yellow); opacity: 0.16; top: 20%; left: 10%; animation-delay: -4s; }

        @keyframes auroraDrift {
            0%,100% { transform: translate(0,0) scale(1) rotate(0deg); }
            25%  { transform: translate(60px,-80px) scale(1.12) rotate(5deg); }
            50%  { transform: translate(-40px,60px) scale(0.92) rotate(-3deg); }
            75%  { transform: translate(30px,40px) scale(1.06) rotate(2deg); }
        }

        /* Grain */
        body::before {
            content: ''; position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            opacity: 0.5;
        }

        /* ── WRAPPER ── */
        .wrapper { position: relative; z-index: 2; max-width: 720px; margin: 0 auto; padding: 0 20px 160px; }

        /* ── HEADER ── */
        header {
            text-align: center; padding: 56px 0 44px;
            animation: fadeDown 0.9s cubic-bezier(0.16,1,0.3,1) both;
        }

        .logo-lockup { display: inline-block; margin-bottom: 16px; position: relative; }

        /* Animated halo ring behind logo */
        .logo-lockup::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 320px; height: 320px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--orange), var(--pink), var(--cyan), var(--yellow), var(--orange));
            filter: blur(40px);
            opacity: 0.28;
            animation: haloSpin 8s linear infinite;
        }
        @keyframes haloSpin { to { transform: translate(-50%,-50%) rotate(360deg); } }

        .logo-img {
            width: 260px; height: auto; display: block; position: relative;
            mix-blend-mode: lighten;
            filter: brightness(1.1) drop-shadow(0 0 30px rgba(255,95,31,0.5));
            transition: transform 0.4s ease, filter 0.4s ease;
        }
        .logo-img:hover {
            transform: scale(1.05);
            filter: brightness(1.2) drop-shadow(0 0 50px rgba(255,95,31,0.75));
        }

        .tagline {
            font-size: 1.05rem; letter-spacing: 0.06em;
            background: linear-gradient(90deg, var(--orange), var(--yellow), var(--cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeDown 0.9s 0.15s cubic-bezier(0.16,1,0.3,1) both;
        }

        /* ── SEARCH ── */
        .search-wrap {
            position: relative; max-width: 600px; margin: 36px auto 52px;
            animation: fadeDown 0.9s 0.25s cubic-bezier(0.16,1,0.3,1) both;
        }
        .search-icon {
            position: absolute; left: 22px; top: 50%; transform: translateY(-50%);
            font-size: 1.2rem; pointer-events: none;
        }
        #searchBar {
            width: 100%; padding: 20px 26px 20px 56px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 100px;
            color: #fff; font-family: 'DM Sans', sans-serif; font-size: 1.15rem;
            outline: none; transition: all 0.35s ease;
            backdrop-filter: blur(16px);
        }
        #searchBar::placeholder { color: var(--muted); }
        #searchBar:focus {
            border-color: var(--cyan);
            background: rgba(0,229,255,0.05);
            box-shadow: 0 0 0 3px rgba(0,229,255,0.12), 0 20px 50px rgba(0,0,0,0.4);
        }

        /* ── SECTION LABEL ── */
        .section-label {
            font-family: 'Syne', sans-serif;
            font-size: 0.8rem; letter-spacing: 0.18em; text-transform: uppercase;
            color: var(--muted); margin-bottom: 32px;
            display: flex; align-items: center; gap: 14px;
            animation: fadeDown 0.9s 0.35s cubic-bezier(0.16,1,0.3,1) both;
        }
        .section-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }

        /* ── VIDEO LIST — single column ── */
        #videoList {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        /* accent colours cycling per card */
        .video-card:nth-child(4n+1) { --accent: var(--orange); --accent-rgb: 255,95,31; }
        .video-card:nth-child(4n+2) { --accent: var(--cyan);   --accent-rgb: 0,229,255; }
        .video-card:nth-child(4n+3) { --accent: var(--pink);   --accent-rgb: 255,45,120; }
        .video-card:nth-child(4n+4) { --accent: var(--yellow); --accent-rgb: 255,214,0; }

        .video-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 28px;
            overflow: hidden;
            position: relative;
            transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), box-shadow 0.4s ease;
            animation: cardIn 0.7s cubic-bezier(0.16,1,0.3,1) both;
        }

        /* top accent stripe */
        .video-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--accent), transparent);
            z-index: 2;
        }

        /* soft glow behind card */
        .video-card::after {
            content: '';
            position: absolute; inset: -1px;
            border-radius: 28px;
            background: transparent;
            border: 1px solid transparent;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
            pointer-events: none; z-index: 3;
        }
        .video-card:hover {
            transform: translateY(-6px) scale(1.005);
            box-shadow: 0 40px 80px rgba(0,0,0,0.6),
                        0 0 60px rgba(var(--accent-rgb), 0.15);
        }
        .video-card:hover::after {
            border-color: rgba(var(--accent-rgb), 0.35);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(40px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── IFRAME ── */
        .iframe-wrap {
            position: relative; width: 100%; aspect-ratio: 16/9;
            background: #05050F;
        }
        .iframe-wrap::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to bottom, transparent 55%, rgba(8,8,16,0.7));
            pointer-events: none; z-index: 1;
        }
        iframe { width: 100%; height: 100%; border: none; display: block; }

        /* ── CARD BODY ── */
        .card-body {
            padding: 22px 26px 26px;
            display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
        }

        .card-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.35rem; font-weight: 800;
            line-height: 1.3; color: #fff;
            flex: 1;
        }

        .lang-pill {
            flex-shrink: 0;
            font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
            padding: 6px 14px; border-radius: 100px;
            background: rgba(var(--accent-rgb), 0.12);
            color: var(--accent);
            border: 1px solid rgba(var(--accent-rgb), 0.3);
            margin-top: 3px;
        }

        /* ── STATUS / SPINNER ── */
        #status {
            text-align: center; padding: 100px 20px;
            color: var(--muted); font-size: 1.1rem;
        }
        .spinner {
            width: 44px; height: 44px; margin: 0 auto 20px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--cyan), var(--pink), var(--orange), transparent);
            animation: spin 1s linear infinite;
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #fff 0);
            mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #fff 0);
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── NAV BAR ── */
        .nav-bar {
            position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
            background: rgba(10,10,18,0.9); backdrop-filter: blur(28px);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 10px 12px; border-radius: 100px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.7);
            z-index: 1000;
            animation: fadeUp 0.9s 0.5s cubic-bezier(0.16,1,0.3,1) both;
        }

        .btn {
            padding: 16px 36px; border-radius: 100px; border: none;
            font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.05rem;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
            letter-spacing: 0.03em; white-space: nowrap;
        }
        .btn-hindi {
            background: linear-gradient(135deg, var(--orange) 0%, var(--yellow) 100%);
            color: #000;
            box-shadow: 0 8px 24px rgba(255,95,31,0.45), 0 0 0 0 rgba(255,95,31,0);
            animation: btnPulse 3s ease-in-out infinite;
        }
        @keyframes btnPulse {
            0%,100% { box-shadow: 0 8px 24px rgba(255,95,31,0.45), 0 0 0 0 rgba(255,95,31,0); }
            50%      { box-shadow: 0 8px 32px rgba(255,95,31,0.6), 0 0 0 8px rgba(255,95,31,0); }
        }
        .btn-hindi:hover {
            transform: scale(1.06);
            box-shadow: 0 12px 36px rgba(255,95,31,0.65);
        }
        .btn-english {
            background: linear-gradient(135deg, var(--cyan) 0%, #0099CC 100%);
            color: #000;
            box-shadow: 0 8px 24px rgba(0,229,255,0.4);
            animation: btnPulseBlue 3s ease-in-out infinite;
        }
        @keyframes btnPulseBlue {
            0%,100% { box-shadow: 0 8px 24px rgba(0,229,255,0.4); }
            50%      { box-shadow: 0 8px 36px rgba(0,229,255,0.65); }
        }
        .btn-english:hover {
            transform: scale(1.06);
            box-shadow: 0 12px 36px rgba(0,229,255,0.6);
        }
        .btn:active { transform: scale(0.95) !important; }

        /* ── EMPTY ── */
        .empty {
            text-align: center; padding: 80px 20px; color: var(--muted);
        }
        .empty-emoji { font-size: 3.5rem; margin-bottom: 18px; display: block; }
        .empty h3 { font-family: 'Syne', sans-serif; font-size: 1.4rem; color: #333355; margin-bottom: 8px; }

        /* ── KEYFRAMES ── */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-22px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateX(-50%) translateY(22px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        @media (max-width: 500px) {
            .logo-img { width: 200px; }
            .card-title { font-size: 1.15rem; }
            .btn { padding: 14px 26px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

<div class="aurora">
    <div class="aurora-blob ab1"></div>
    <div class="aurora-blob ab2"></div>
    <div class="aurora-blob ab3"></div>
    <div class="aurora-blob ab4"></div>
</div>

<div class="wrapper">
    <header>
        <div class="logo-lockup">
            <img src="IMG_1285.png" alt="Tech Saathi" class="logo-img">
        </div>
        <p class="tagline">Your Digital Companion &nbsp;•&nbsp; आपका डिजिटल साथी</p>
    </header>

    <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchBar" placeholder="Search for a lesson…" oninput="render()" autocomplete="off">
    </div>

    <div class="section-label" id="sectionLabel">All Lessons</div>

    <div id="videoList">
        <div id="status">
            <div class="spinner"></div>
            Loading your library…
        </div>
    </div>
</div>

<div class="nav-bar">
    <button class="btn btn-hindi" id="langBtn" onclick="toggleLanguage()">🇮🇳 &nbsp;हिंदी Mode</button>
</div>

<script>
    const API = 'https://sheetdb.io/api/v1/2wpmdmnad79er';
    let allVideos = [];
    let currentLang = 'English';

    async function fetchData() {
        try {
            const res = await fetch(API);
            allVideos = await res.json();
            render();
        } catch (e) {
            document.getElementById('videoList').innerHTML =
                `<div class="empty"><span class="empty-emoji">⚡</span><h3>Connection failed</h3><p>Could not reach the database.</p></div>`;
        }
    }

    function getYouTubeID(url) {
        if (!url) return null;
        const s = url.match(/^.*(youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/);
        if (s && s[2].length === 11) return s[2];
        const sh = url.match(/youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/);
        return sh ? sh[1] : null;
    }

    function render() {
        const q = document.getElementById('searchBar').value.toLowerCase();
        const container = document.getElementById('videoList');
        const label = document.getElementById('sectionLabel');

        const filtered = allVideos.filter(v =>
            v.language === currentLang && (v.title || '').toLowerCase().includes(q)
        );

        label.textContent = currentLang === 'Hindi'
            ? `हिंदी पाठ — ${filtered.length} वीडियो`
            : `${filtered.length} Lesson${filtered.length !== 1 ? 's' : ''} Available`;

        if (filtered.length === 0) {
            container.innerHTML = `<div class="empty">
                <span class="empty-emoji">${currentLang === 'Hindi' ? '📚' : '🔎'}</span>
                <h3>${currentLang === 'Hindi' ? 'कोई वीडियो नहीं मिला' : 'No lessons found'}</h3>
                <p>${currentLang === 'Hindi' ? 'अभी कोई वीडियो उपलब्ध नहीं है।' : 'Try a different search term.'}</p>
            </div>`;
            return;
        }

        container.innerHTML = filtered.map((v, i) => {
            const id = getYouTubeID(v.url);
            if (!id) return '';
            return `
            <div class="video-card" style="animation-delay:${i * 0.08}s">
                <div class="iframe-wrap">
                    <iframe src="https://www.youtube.com/embed/${id}?rel=0" allowfullscreen loading="lazy"></iframe>
                </div>
                <div class="card-body">
                    <div class="card-title">${v.title}</div>
                    <span class="lang-pill">${v.language}</span>
                </div>
            </div>`;
        }).join('');
    }

    function toggleLanguage() {
        const btn = document.getElementById('langBtn');
        if (currentLang === 'English') {
            currentLang = 'Hindi';
            btn.innerHTML = '🌐 &nbsp;English Mode';
            btn.className = 'btn btn-english';
        } else {
            currentLang = 'English';
            btn.innerHTML = '🇮🇳 &nbsp;हिंदी Mode';
            btn.className = 'btn btn-hindi';
        }
        render();
    }

    fetchData();
</script>
</body>
</html>
