<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tech Saathi - Your Digital Companion</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --orange: #FF5F1F;
            --gold: #FFB347;
            --deep: #0D0D0D;
            --surface: #141414;
            --card: #1A1A1A;
            --border: rgba(255,255,255,0.07);
            --text: #F0EDE8;
            --muted: #6B6B6B;
            --glow: rgba(255, 95, 31, 0.35);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--deep);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            cursor: default;
        }

        /* ── Animated background ── */
        .bg-orbs {
            position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
        }
        .orb {
            position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.18;
            animation: drift 20s ease-in-out infinite;
        }
        .orb-1 { width: 600px; height: 600px; background: var(--orange); top: -200px; right: -150px; animation-delay: 0s; }
        .orb-2 { width: 400px; height: 400px; background: #FFB347; bottom: 100px; left: -100px; animation-delay: -7s; }
        .orb-3 { width: 300px; height: 300px; background: #FF3C00; top: 50%; left: 40%; animation-delay: -13s; }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -60px) scale(1.1); }
            66% { transform: translate(-30px, 40px) scale(0.95); }
        }

        /* Noise grain overlay */
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
            opacity: 0.4;
        }

        .wrapper { position: relative; z-index: 2; max-width: 980px; margin: 0 auto; padding: 0 20px 160px; }

        /* ── Header ── */
        header {
            text-align: center;
            padding: 60px 0 50px;
            animation: fadeDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .logo-lockup {
            display: inline-block;
            position: relative;
            margin-bottom: 18px;
        }

        .logo-img {
            width: 220px;
            height: auto;
            display: block;
            filter: drop-shadow(0 0 40px var(--glow));
            transition: filter 0.4s ease;
        }
        .logo-img:hover { filter: drop-shadow(0 0 60px rgba(255,95,31,0.6)); }

        .badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(255,95,31,0.12); border: 1px solid rgba(255,95,31,0.3);
            border-radius: 100px; padding: 5px 14px;
            font-size: 0.72rem; font-weight: 500; letter-spacing: 0.08em;
            color: var(--gold); text-transform: uppercase; margin-bottom: 18px;
            animation: fadeDown 0.8s 0.1s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .badge-dot { width: 6px; height: 6px; background: #4ade80; border-radius: 50%; animation: pulse-dot 2s ease-in-out infinite; }
        @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.7)} }

        .tagline {
            color: var(--muted); font-size: 0.95rem; letter-spacing: 0.04em;
            animation: fadeDown 0.8s 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        /* ── Search ── */
        .search-wrap {
            position: relative; max-width: 560px; margin: 40px auto 56px;
            animation: fadeDown 0.8s 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .search-icon {
            position: absolute; left: 22px; top: 50%; transform: translateY(-50%);
            color: var(--muted); pointer-events: none; font-size: 1.1rem;
        }
        #searchBar {
            width: 100%; padding: 18px 24px 18px 52px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 100px;
            color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 1rem;
            outline: none; transition: all 0.3s ease;
            backdrop-filter: blur(12px);
        }
        #searchBar::placeholder { color: var(--muted); }
        #searchBar:focus {
            border-color: rgba(255,95,31,0.5);
            background: rgba(255,95,31,0.06);
            box-shadow: 0 0 0 4px rgba(255,95,31,0.08), 0 20px 40px rgba(0,0,0,0.3);
        }

        /* ── Section label ── */
        .section-label {
            font-family: 'Syne', sans-serif;
            font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase;
            color: var(--muted); margin-bottom: 28px;
            display: flex; align-items: center; gap: 14px;
        }
        .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        /* ── Video Grid ── */
        #videoList {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .video-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            transition: transform 0.35s cubic-bezier(0.16,1,0.3,1), box-shadow 0.35s ease, border-color 0.3s ease;
            animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .video-card:hover {
            transform: translateY(-8px) scale(1.01);
            border-color: rgba(255,95,31,0.25);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,95,31,0.1), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .iframe-wrap {
            position: relative; width: 100%; aspect-ratio: 16/9;
            background: #0D0D0D;
        }
        .iframe-wrap::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.6));
            pointer-events: none; z-index: 1;
        }
        iframe {
            width: 100%; height: 100%; border: none; display: block;
        }

        .card-body { padding: 20px 22px 22px; }

        .card-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.05rem; font-weight: 700;
            line-height: 1.35; color: var(--text);
            margin-bottom: 12px;
        }

        .card-meta {
            display: flex; align-items: center; gap: 8px;
        }
        .lang-pill {
            font-size: 0.65rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
            padding: 3px 10px; border-radius: 100px;
            background: rgba(255,95,31,0.12); color: var(--orange); border: 1px solid rgba(255,95,31,0.2);
        }

        /* ── Status ── */
        #status {
            text-align: center; padding: 80px 20px;
            color: var(--muted); font-size: 1rem; font-weight: 400;
            grid-column: 1/-1;
        }
        .spinner {
            width: 36px; height: 36px; margin: 0 auto 16px;
            border: 2px solid rgba(255,95,31,0.15);
            border-top-color: var(--orange);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Nav bar ── */
        .nav-bar {
            position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; align-items: center;
            background: rgba(20,20,20,0.85); backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            padding: 10px 14px; border-radius: 100px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03);
            z-index: 1000;
            animation: fadeUp 0.8s 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .btn {
            padding: 13px 28px; border-radius: 100px; border: none;
            font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.9rem;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
            letter-spacing: 0.02em; white-space: nowrap;
        }
        .btn-hindi {
            background: linear-gradient(135deg, var(--orange), #FF8C42);
            color: #fff;
            box-shadow: 0 6px 20px rgba(255,95,31,0.35);
        }
        .btn-hindi:hover {
            transform: scale(1.04);
            box-shadow: 0 10px 30px rgba(255,95,31,0.5);
        }
        .btn-english {
            background: linear-gradient(135deg, #2980b9, #5DADE2);
            color: #fff;
            box-shadow: 0 6px 20px rgba(41,128,185,0.35);
        }
        .btn-english:hover {
            transform: scale(1.04);
            box-shadow: 0 10px 30px rgba(41,128,185,0.5);
        }
        .btn:active { transform: scale(0.96) !important; }

        /* ── Empty state ── */
        .empty {
            grid-column: 1/-1; text-align: center; padding: 80px 20px;
            color: var(--muted);
        }
        .empty-emoji { font-size: 3rem; margin-bottom: 16px; display: block; }
        .empty h3 { font-family: 'Syne', sans-serif; font-size: 1.1rem; color: #444; margin-bottom: 8px; }

        /* ── Animations ── */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            header { padding: 40px 0 30px; }
            .logo-img { width: 160px; }
            #videoList { grid-template-columns: 1fr; }
            .btn { padding: 12px 20px; font-size: 0.82rem; }
        }
    </style>
</head>
<body>

<div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<div class="wrapper">
    <header>
        <div class="badge"><span class="badge-dot"></span> Live Library</div>
        <div class="logo-lockup">
            <img src="IMG_1285.png" alt="Tech Saathi" class="logo-img">
        </div>
        <p class="tagline">Your Digital Companion &nbsp;•&nbsp; आपका डिजिटल साथी</p>
    </header>

    <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchBar" placeholder="Search for a lesson…" oninput="render()" autocomplete="off">
    </div>

    <div class="section-label" id="sectionLabel">All Lessons</div>

    <div id="videoList">
        <div id="status">
            <div class="spinner"></div>
            Loading your library…
        </div>
    </div>
</div>

<div class="nav-bar">
    <button class="btn btn-hindi" id="langBtn" onclick="toggleLanguage()">🇮🇳 &nbsp;हिंदी Mode</button>
</div>

<script>
    const API = 'https://sheetdb.io/api/v1/2wpmdmnad79er';
    let allVideos = [];
    let currentLang = 'English';

    async function fetchData() {
        try {
            const res = await fetch(API);
            allVideos = await res.json();
            render();
        } catch (e) {
            document.getElementById('videoList').innerHTML =
                `<div class="empty"><span class="empty-emoji">⚡</span><h3>Connection failed</h3><p>Could not reach the database.</p></div>`;
        }
    }

    function getYouTubeID(url) {
        if (!url) return null;
        const s = url.match(/^.*(youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/);
        if (s && s[2].length === 11) return s[2];
        const sh = url.match(/youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/);
        return sh ? sh[1] : null;
    }

    function render() {
        const q = document.getElementById('searchBar').value.toLowerCase();
        const container = document.getElementById('videoList');
        const label = document.getElementById('sectionLabel');

        const filtered = allVideos.filter(v =>
            v.language === currentLang && (v.title || '').toLowerCase().includes(q)
        );

        label.textContent = currentLang === 'Hindi' ? `हिंदी पाठ — ${filtered.length} वीडियो` : `${filtered.length} Lesson${filtered.length !== 1 ? 's' : ''} Available`;

        if (filtered.length === 0) {
            container.innerHTML = `<div class="empty">
                <span class="empty-emoji">${currentLang === 'Hindi' ? '📚' : '🔎'}</span>
                <h3>${currentLang === 'Hindi' ? 'कोई वीडियो नहीं मिला' : 'No lessons found'}</h3>
                <p>${currentLang === 'Hindi' ? 'अभी कोई वीडियो उपलब्ध नहीं है।' : 'Try a different search term.'}</p>
            </div>`;
            return;
        }

        container.innerHTML = filtered.map((v, i) => {
            const id = getYouTubeID(v.url);
            if (!id) return '';
            return `
            <div class="video-card" style="animation-delay:${i * 0.07}s">
                <div class="iframe-wrap">
                    <iframe src="https://www.youtube.com/embed/${id}?rel=0" allowfullscreen loading="lazy"></iframe>
                </div>
                <div class="card-body">
                    <div class="card-title">${v.title}</div>
                    <div class="card-meta">
                        <span class="lang-pill">${v.language}</span>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function toggleLanguage() {
        const btn = document.getElementById('langBtn');
        if (currentLang === 'English') {
            currentLang = 'Hindi';
            btn.textContent = '🌐  English Mode';
            btn.className = 'btn btn-english';
        } else {
            currentLang = 'English';
            btn.innerHTML = '🇮🇳 &nbsp;हिंदी Mode';
            btn.className = 'btn btn-hindi';
        }
        render();
    }

    fetchData();
</script>
</body>
</html>
